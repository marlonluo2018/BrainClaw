[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brainclaw"
version = "0.1.0"
description = "File-based personal assistant workflows and deterministic quality gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "ruff==0.13.2",
]
documents = [
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
]
outlook = [
  "pywin32==311; platform_system == 'Windows'",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
  "assistant_brain/skills",
  "assistant_brain/tasks",
  "assistant_brain/process",
  "downloads",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
